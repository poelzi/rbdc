[package]
name = "rbdc-turso"
version = "4.7.0"
edition = "2021"
description = "Turso/libSQL async database driver for rbdc"
readme = "Readme.md"
authors = ["ce <zhuxiujia@qq.com>"]
license = "Apache-2.0"
categories = ["database"]
keywords = ["database", "orm", "turso", "libsql", "sqlite"]
documentation = "https://rbatis.github.io/rbatis.io"
repository = "https://github.com/rbatis/rbatis"
homepage = "https://rbatis.github.io/rbatis.io"

[features]
default = ["tls-rustls"]
tls-rustls = ["rbdc/tls-rustls"]
tls-native-tls = ["rbdc/tls-native-tls"]
## Let turso install mimalloc as the process-wide `#[global_allocator]`.
## Off by default: a database driver should not pick the allocator for the
## binary that links it. Enabling it blocks any other `#[global_allocator]`
## (e.g. jemalloc built for heap profiling) and hides Rust allocations from
## malloc-interposing profilers, because turso links mimalloc without the C
## `malloc` override.
mimalloc = ["turso/mimalloc"]

[dependencies]
rbs = { version = "4" }
rbdc = { version = "4.7", path = "..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
url = { version = "2.2.2", default-features = false }
turso = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["sync", "rt", "time"] }
futures-core = { version = "0.3.19", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
